# Access is decided in the controllers, not here: DocgenControllerBase::handle()
# checks the session and the X-CSRF-Token header of every mutation, and
# DocgenScopeAccess checks permission, group scope and application access.
# That way every refusal, including a missing CSRF token or permission,
# answers with the documented {"error": {"code": "docgen.*"}} envelope
# instead of Drupal's generic 403.
beantragt_docgen.health:
  path: '/api/admin/docgen/health'
  defaults:
    _controller: '\Drupal\beantragt_docgen\Controller\DocgenCatalogController::health'
    _format: json
  requirements:
    _user_is_logged_in: 'TRUE'
  methods: [GET]
  options:
    no_cache: 'TRUE'

beantragt_docgen.template_list:
