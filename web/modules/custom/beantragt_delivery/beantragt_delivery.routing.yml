beantragt_delivery.admin_application_deliveries:
  path: '/api/admin/applications/{application}/deliveries'
  defaults:
    _controller: '\Drupal\beantragt_delivery\Controller\DeliveryController::listDeliveries'
    _format: json
  requirements:
    _permission: 'manage application deliveries'
    _entity_access: 'application.view'
    _custom_access: '\Drupal\beantragt_delivery\Controller\DeliveryController::access'
  methods: [GET]
  options:
    _format: json
    no_cache: 'TRUE'
    parameters:
      application:
        type: entity:application

