    _permission: 'manage application deliveries'
    _entity_access: 'application.update'
    _custom_access: '\Drupal\beantragt_delivery\Controller\DeliveryController::access'
    _csrf_request_header_token: 'TRUE'
  methods: [POST]
  options:
    _format: json
    no_cache: 'TRUE'
    parameters:
      application:
        type: entity:application

beantragt_delivery.local_webhook_receiver:
