default_provider: bundid
providers:
  bundid:
    enabled: false
    label: BundID
    profile: bundid
    create_users: true
    link_by_email: false
    email_verified: false
    sp_entity_id: ''
    sp_acs_url: ''
    sp_x509_cert: ''
    sp_private_key_path: ''
    idp_entity_id: ''
    idp_sso_url: ''
    idp_x509_cert: ''
    name_id_format: 'urn:oasis:names:tc:SAML:2.0:nameid-format:persistent'
    minimum_assurance_level: ''
    allowed_relay_hosts: []
    default_relay_path: '/'
    attribute_map:
      email:
        - mail
        - email
        - 'urn:oid:0.9.2342.19200300.100.1.3'
      first_name:
        - givenName
        - 'urn:oid:2.5.4.42'
      last_name:
        - sn
        - surname
        - 'urn:oid:2.5.4.4'
      full_name:
        - cn
        - displayName
        - 'urn:oid:2.5.4.3'
      birthdate:
        - dateOfBirth
        - birthdate
      assurance_level:
        - assuranceLevel
        - loa
        - acr
    security:
      authn_requests_signed: true
      want_assertions_signed: true
      # BSI TR-03130 requires signed SAML responses for BundID "hoch". The real
      # bundid provider ships disabled and is operator-configured, so this safe
      # default does not affect the local mock flow.
      want_messages_signed: true
  bundid_mock:
    enabled: false
    label: BundID Demo
    profile: bundid_mock
    mock: true
    create_users: true
    link_by_email: false
    email_verified: false
    sp_entity_id: ''
    sp_acs_url: ''
    sp_x509_cert: ''
    sp_private_key_path: ''
    idp_entity_id: ''
    idp_sso_url: ''
    idp_x509_cert: ''
    name_id_format: 'urn:oasis:names:tc:SAML:2.0:nameid-format:persistent'
    minimum_assurance_level: high
    allowed_relay_hosts:
      - 'beantragt.ddev.site:3001'
      - 'localhost:3001'
      - '127.0.0.1:3001'
    default_relay_path: '/'
    attribute_map:
      email:
        - email
        - mail
      first_name:
        - first_name
        - givenName
      last_name:
        - last_name
        - sn
        - surname
      full_name:
        - full_name
        - displayName
      birthdate:
        - birthdate
        - dateOfBirth
      assurance_level:
        - assurance_level
        - loa
        - acr
    mock_claims:
      subject: 'bundid-demo-max-mustermann'
      email: 'max.mustermann@example.org'
      first_name: Max
      last_name: Mustermann
      full_name: Max Mustermann
      birthdate: '1978-09-03'
      assurance_level: high
    security:
      authn_requests_signed: false
      want_assertions_signed: false
      want_messages_signed: false
  staff_mock:
    enabled: false
    label: Staff SSO Demo
    profile: sso_mock
    mock: true
    create_users: false
    link_by_email: false
    email_verified: false
    sp_entity_id: ''
    sp_acs_url: ''
    sp_x509_cert: ''
    sp_private_key_path: ''
    idp_entity_id: ''
    idp_sso_url: ''
    idp_x509_cert: ''
    name_id_format: 'urn:oasis:names:tc:SAML:2.0:nameid-format:persistent'
    minimum_assurance_level: high
    allowed_relay_hosts:
      - 'beantragt.ddev.site:3001'
      - 'localhost:3001'
      - '127.0.0.1:3001'
    default_relay_path: '/'
    attribute_map:
      email:
        - email
        - mail
      first_name:
        - first_name
        - givenName
      last_name:
        - last_name
        - sn
        - surname
      full_name:
        - full_name
        - displayName
      assurance_level:
        - assurance_level
        - loa
        - acr
    mock_claims:
      subject: 'staff-demo'
      email: 'staff.demo@example.org'
      first_name: Demo
      last_name: Sachbearbeitung
      full_name: Demo Sachbearbeitung
      assurance_level: high
    security:
      authn_requests_signed: false
      want_assertions_signed: false
      want_messages_signed: false
