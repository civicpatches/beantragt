beantragt_content.public_pages:
  path: '/api/v1/jurisdictions/{slug}/pages'
  defaults:
    _controller: '\Drupal\beantragt_content\Controller\ContentPageController::listPages'
    _format: json
  requirements:
    # Public content: published pages of a published jurisdiction only.
    _access: 'TRUE'
    slug: '(?=.*[a-z])[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?'
  methods: [GET]
  options:
    _format: json

beantragt_content.public_page:
  path: '/api/v1/jurisdictions/{slug}/pages/{page_key}'
  defaults:
    _controller: '\Drupal\beantragt_content\Controller\ContentPageController::getPage'
    _format: json
  requirements:
    # Public content: published pages of a published jurisdiction only.
    _access: 'TRUE'
    slug: '(?=.*[a-z])[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?'
    page_key: '[a-z0-9](?:[a-z0-9_-]{0,126}[a-z0-9])?'
  methods: [GET]
  options:
    _format: json

beantragt_content.public_documents:
  path: '/api/v1/jurisdictions/{slug}/documents'
  defaults:
    _controller: '\Drupal\beantragt_content\Controller\PublicDocumentController::listDocuments'
    _format: json
  requirements:
    # Public content of a published jurisdiction, flood-limited in the controller.
    _access: 'TRUE'
    slug: '(?=.*[a-z])[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?'
  methods: [GET]
  options:
    _format: json

beantragt_content.public_sections:
  path: '/api/v1/jurisdictions/{slug}/sections'
  defaults:
    _controller: '\Drupal\beantragt_content\Controller\PublicContentSectionController::listSections'
    _format: json
  requirements:
    # Public content of a published jurisdiction, flood-limited in the controller.
    _access: 'TRUE'
    slug: '(?=.*[a-z])[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?'
  methods: [GET]
  options:
    _format: json

beantragt_content.public_document_download:
  path: '/api/v1/jurisdictions/{slug}/documents/{document_uuid}/file'
  defaults:
    _controller: '\Drupal\beantragt_content\Controller\PublicDocumentController::downloadDocument'
  requirements:
    # Public document of a published jurisdiction, flood-limited in the controller.
    _access: 'TRUE'
    slug: '(?=.*[a-z])[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?'
    document_uuid: '[0-9a-f-]{36}'
  methods: [GET]

beantragt_content.admin_boilerplates:
  path: '/api/admin/jurisdictions/{jurisdiction_id}/boilerplates'
  defaults:
    _controller: '\Drupal\beantragt_content\Controller\BoilerplateController::listBoilerplates'
    _format: json
  requirements:
    _custom_access: '\Drupal\beantragt_content\Controller\BoilerplateController::accessCheck'
    jurisdiction_id: '[a-z0-9-]+'
  methods: [GET]
  options:
    _format: json
    _auth: ['cookie']

