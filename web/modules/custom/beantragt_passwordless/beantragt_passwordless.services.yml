services:
  logger.channel.beantragt_passwordless:
    parent: logger.channel_base
    arguments: ['beantragt_passwordless']

  beantragt_passwordless.otp:
    class: Drupal\beantragt_passwordless\Service\OtpService
    arguments:
      - '@database'
      - '@plugin.manager.mail'
      - '@current_user'
      - '@logger.channel.beantragt_passwordless'
      - '@config.factory'
      - '@entity_type.manager'
      - '@language_manager'
      - '@beantragt_applicant.manager'
      - '@session_manager'
      - '@beantragt_passwordless.verified_mail'

  beantragt_passwordless.verified_mail:
    class: Drupal\beantragt_passwordless\Service\VerifiedAccountMail
    arguments: ['@database', '@cache_tags.invalidator']

  beantragt_passwordless.citizen_erasure:
    class: Drupal\beantragt_passwordless\Service\CitizenErasureService
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@module_handler'
      - '@cache_tags.invalidator'
      - '@beantragt_application.retention_cleanup'
      - '@logger.channel.beantragt_passwordless'
      - '@?beantragt_application.data_protection'
      - '@beantragt_passwordless.verified_mail'
