beantragt_passwordless.request_code:
  path: '/auth/request-code'
  defaults:
    _controller: '\Drupal\beantragt_passwordless\Controller\PasswordlessAuthController::requestCode'
  methods: [POST]
  requirements:
    # Login entry point, flood-limited per email and IP in the controller.
    _access: 'TRUE'
  options:
    _auth: ['cookie', 'basic_auth']
    no_cache: 'TRUE'

beantragt_passwordless.verify_code:
  path: '/auth/verify-code'
  defaults:
    _controller: '\Drupal\beantragt_passwordless\Controller\PasswordlessAuthController::verifyCode'
  methods: [POST]
  requirements:
    # Login entry point with lockout and backoff in the controller.
    _access: 'TRUE'
  options:
    _auth: ['cookie', 'basic_auth']
    no_cache: 'TRUE'

beantragt_passwordless.logout:
  path: '/auth/logout'
  defaults:
    _controller: '\Drupal\beantragt_passwordless\Controller\PasswordlessAuthController::logout'
  methods: [POST]
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    _auth: ['cookie', 'basic_auth']
    no_cache: 'TRUE'

beantragt_passwordless.user_status:
  path: '/auth/status'
  defaults:
    _controller: '\Drupal\beantragt_passwordless\Controller\PasswordlessAuthController::status'
  methods: [GET]
  requirements:
    # Reports the session of the caller, anonymous gets authenticated false.
    _access: 'TRUE'
  options:
    _auth: ['cookie', 'basic_auth']
    no_cache: 'TRUE'

beantragt_passwordless.api_v1_request_code:
  path: '/api/v1/auth/request-code'
  defaults:
    _controller: '\Drupal\beantragt_passwordless\Controller\PasswordlessAuthController::requestCodeV1'
    _format: json
  methods: [POST]
  requirements:
    # Login entry point, flood-limited per email and IP in the controller.
    _access: 'TRUE'
  options:
    _format: json
    _auth: ['cookie', 'basic_auth']
    no_cache: 'TRUE'

beantragt_passwordless.api_v1_verify_code:
  path: '/api/v1/auth/verify-code'
  defaults:
    _controller: '\Drupal\beantragt_passwordless\Controller\PasswordlessAuthController::verifyCodeV1'
    _format: json
  methods: [POST]
  requirements:
    # Login entry point; challenge, lockout and backoff checked in the controller.
    _access: 'TRUE'
  options:
    _format: json
    _auth: ['cookie', 'basic_auth']
    no_cache: 'TRUE'

beantragt_passwordless.api_v1_status:
  path: '/api/v1/auth/status'
  defaults:
    _controller: '\Drupal\beantragt_passwordless\Controller\PasswordlessAuthController::statusV1'
    _format: json
  methods: [GET]
  requirements:
    # Reports the session of the caller, anonymous gets authenticated false.
    _access: 'TRUE'
  options:
    _format: json
    _auth: ['cookie', 'basic_auth']
    no_cache: 'TRUE'

beantragt_passwordless.api_v1_logout:
  path: '/api/v1/auth/logout'
  defaults:
    _controller: '\Drupal\beantragt_passwordless\Controller\PasswordlessAuthController::logoutV1'
    _format: json
  methods: [POST]
  requirements:
    # Ends the own session with CSRF check; anonymous calls change nothing.
    _access: 'TRUE'
  options:
    _format: json
    _auth: ['cookie', 'basic_auth']
    no_cache: 'TRUE'

beantragt_passwordless.settings:
  path: '/admin/config/system/beantragt-passwordless'
  defaults:
    _form: '\Drupal\beantragt_passwordless\Form\PasswordlessSettingsForm'
    _title: 'Passwordless Authentication Settings'
  requirements:
    _permission: 'administer site configuration'

# "Meine Daten" erasure (Art. 17 GDPR for the account data). Submitted
# applications stay with the authority; the preview names them.
beantragt_passwordless.gdpr_preview:
  path: '/auth/gdpr/preview'
  defaults:
    _controller: '\Drupal\beantragt_passwordless\Controller\GdprController::preview'
  methods: [GET]
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    _auth: ['cookie', 'basic_auth']
    no_cache: 'TRUE'

# Requires an authenticated user + CSRF token.
beantragt_passwordless.gdpr_delete_all:
  path: '/auth/gdpr/all'
  defaults:
    _controller: '\Drupal\beantragt_passwordless\Controller\GdprController::deleteAll'
  methods: [DELETE]
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    _auth: ['cookie', 'basic_auth']
    no_cache: 'TRUE'
