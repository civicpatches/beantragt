beantragt_application.admin_data_update:
  path: '/api/admin/applications/{application}/data'
  defaults:
    _controller: '\Drupal\beantragt_application\Controller\ApplicationDataController::update'
  requirements:
    _permission: 'edit application data entities'
    _entity_access: 'application.update'
    _custom_access: '\Drupal\beantragt_application\Controller\ApplicationDataController::access'
    _csrf_request_header_token: 'TRUE'
  methods: [PATCH]
  options:
    parameters:
      application:
        type: entity:application

beantragt_application.admin_application_delete:
  path: '/api/admin/applications/{application}'
