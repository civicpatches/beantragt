    _custom_access: '\Drupal\beantragt_application\Controller\ApplicationDataController::deleteAccess'
    _csrf_request_header_token: 'TRUE'
  methods: [DELETE]
  options:
    no_cache: TRUE
    parameters:
      application:
        type: entity:application

