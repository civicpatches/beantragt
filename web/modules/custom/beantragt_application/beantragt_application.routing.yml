# Internal: Nuxt proxy only, not part of /api/v1 and therefore not in
# the OpenAPI contract. Staff only: the owning citizen passes
# application.view, so workflowAccess() adds the staff scope check.
beantragt_application.admin_workflow:
  path: '/api/admin/applications/{application}/workflow'
  defaults:
    _controller: '\Drupal\beantragt_application\Controller\ApplicationDataController::workflow'
  requirements:
    _entity_access: 'application.view'
    _custom_access: '\Drupal\beantragt_application\Controller\ApplicationDataController::workflowAccess'
  methods: [GET]
  options:
    no_cache: TRUE
    parameters:
      application:
        type: entity:application

# Internal: Nuxt proxy only, not part of /api/v1. Sets a valid status
# for an application whose status left the current workflow; same guards as
# the rollback.
beantragt_application.admin_status_correction:
  path: '/api/admin/applications/{application}/status-correction'
  defaults:
    _controller: '\Drupal\beantragt_application\Controller\ApplicationDataController::correctStatus'
  requirements:
    _permission: 'manage workflow transitions'
    _entity_access: 'application.update'
    _custom_access: '\Drupal\beantragt_application\Controller\ApplicationDataController::statusAccess'
    _csrf_request_header_token: 'TRUE'
  methods: [PATCH]
  options:
    no_cache: TRUE
    parameters:
      application:
        type: entity:application

