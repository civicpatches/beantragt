beantragt_application.settings:
  type: config_object
  label: 'Beantragt Application settings'
  mapping:
    data_retention_days:
      type: integer
      label: 'Data retention period in days'
    attachment_max_total_bytes_per_application:
      type: integer
      label: 'Maximum total attachment bytes per application'
    confirmation_token_ttl_hours:
      type: integer
      label: 'Email confirmation token lifetime in hours'
    confirmation_purge_hours:
      type: integer
      label: 'Unconfirmed application purge window in hours'
